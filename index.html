<script>
const $=s=>document.querySelector(s);
const DK=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const TPL=[
{n:'Water',i:'💧',t:'amount',g:2.5,u:'L',s:0.25,c:'#27c4ff',viz:'glass'},
{n:'Walking',i:'🚶',t:'amount',g:5,u:'km',s:1,c:'#8fd400'},
{n:'Sleep',i:'🌙',t:'amount',g:8,u:'hours',s:1,c:'#8b7bff'},
{n:'Reading',i:'📖',t:'amount',g:30,u:'min',s:15,c:'#ff9f43'},
{n:'Make the bed',i:'🛏️',t:'binary',g:1,u:'',s:1,c:'#00b8b0'},
{n:'Social media',i:'📱',t:'limit',g:2,u:'hours',s:0.5,c:'#ff6b57'}];
const CATS=[['health','Health 🌳'],['learning','Learning 📚'],['fitness','Fitness 🏁'],['rest','Rest & recovery 🌙'],['other','Other 🌼']];
const LV=['Beginner','Building Momentum','Consistent','Thriving','Unstoppable'];
const r3=x=>Math.round(x*1000)/1000;
const fmt=x=>String(r3(x));
const dk=d=>{const z=new Date(d);return z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0')};
const addD=(k,n)=>{const d=new Date(k+'T12:00:00');d.setDate(d.getDate()+n);return dk(d)};
const today=()=>dk(new Date());
let S;try{S=JSON.parse(localStorage.getItem('pulse1'))}catch(e){}
S=S||{habits:[],days:{},awards:{},xp:0,set:{sound:true,reduce:false,theme:'auto'}};
let fp=null,fpPushed=false,tab='home',undo=null,sel=today(),popId=null,enter=true,dir=0,busy=0;const PV={};
function save(){try{localStorage.setItem('pulse1',JSON.stringify(S))}catch(e){}}
const sched=(h,k)=>!h.paused&&!h.archived&&k>=h.start&&(h.once?k===h.once:h.days.includes(new Date(k+'T12:00:00').getDay()));
const val=(h,k)=>(S.days[k]&&S.days[k][h.id])?S.days[k][h.id].v:0;
const tgt=(h,k)=>(S.days[k]&&S.days[k][h.id])?S.days[k][h.id].t:h.g;
function ok(h,k){const v=val(h,k),t=tgt(h,k);
 if(h.t==='limit')return (S.days[k]&&S.days[k][h.id]&&v<=t)||(k<today()&&v<=t);
 return v>=t&&v>0||(h.t==='binary'&&v>=1)}
function frac(h,k){if(h.t==='limit')return ok(h,k)?1:0;return Math.min(1,val(h,k)/tgt(h,k))}
function dayPct(k){const hs=S.habits.filter(h=>sched(h,k));if(!hs.length)return null;return hs.reduce((a,h)=>a+frac(h,k),0)/hs.length}
function streak(h){if(h.once)return 0;let k=today(),n=0,sc=99;
 if(sched(h,k)&&!ok(h,k))k=addD(k,-1);
 for(let i=0;i<400&&k>=h.start;i++,k=addD(k,-1)){if(!sched(h,k))continue;if(ok(h,k)){n++;sc++}else if(sc<7)break;else sc=0}
 return n}
const allStreak=()=>S.habits.reduce((m,h)=>Math.max(m,streak(h)),0);
function lvl(){const l=Math.min(4,Math.floor(Math.sqrt(S.xp/50)));const a=l*l*50,b=(l+1)*(l+1)*50;return{l,p:l>=4?1:(S.xp-a)/(b-a),a,b}}
function log(h,delta,k,c){k=k||sel;S.days[k]=S.days[k]||{};
 const prev=S.days[k][h.id]?{...S.days[k][h.id]}:null,was=ok(h,k);
 const cur=S.days[k][h.id]||{v:0,t:h.g};
 let nv=r3(Math.max(0,cur.v+delta));if(h.t==='binary')nv=Math.min(1,nv);
 if(nv===cur.v&&prev)return;
 S.days[k][h.id]={...cur,v:nv,t:cur.t,...(c?{c}:{})};
 undo={hid:h.id,k,prev};
 if(!was&&ok(h,k)&&h.t!=='limit'){const ak=k+'|'+h.id;if(!S.awards[ak]){S.awards[ak]=1;S.xp+=20;popId=h.id;celebrate(h);toast(h.i+' '+h.n+' complete! +20 XP · +5 '+MAT[CM[h.cat||'health']][0],true)}else toast('Logged (XP already earned today)',true)}
 else if(h.av||h.t==='check'||h.t==='rating')toast(h.av?(delta>0?'Slip logged. Tomorrow is a fresh start.':delta<0?'Slip removed':'Marked clean today ✓'):'Saved',true);
 else if(delta>0){const ak='p|'+k+'|'+h.id;if(!S.awards[ak]){S.awards[ak]=1;S.xp+=2}toast('Logged '+fmt(delta)+' '+h.u,true)}
 else toast('Removed '+fmt(-delta)+' '+h.u,true);
 const hs=S.habits.filter(x=>sched(x,k));
 if(hs.length&&hs.every(x=>ok(x,k))&&!S.awards['all|'+k]){S.awards['all|'+k]=1;S.xp+=30;setTimeout(()=>toast('🎉 All goals done today! +30 XP',false),900)}
 vib(15);save();render();setTimeout(eraCheck,1200);if(h.rand)setTimeout(()=>sweepRand(true),4600)}

// Spring: damping ratio + response (seconds). Re-targeting keeps position AND velocity, so it is always interruptible.
function mkSpring(o){const s=Object.assign({x:0,v:0,to:0,resp:.35,damp:1,raf:0,tick:()=>{},end:null},o);

  if(Math.abs(s.x-s.to)<.4&&Math.abs(s.v)<8){s.x=s.to;s.v=0;s.raf=0;s.tick(s.x);const e=s.end;s.end=null;e&&e();return}
  s.tick(s.x);s.raf=requestAnimationFrame(step)};

 s.stop=()=>{cancelAnimationFrame(s.raf);s.raf=0;s.v=0};return s}

/* City: 1:1 drag with rubber-banded edges, then momentum (exponential decay) and spring-back */
let panRaw=null,flingId=0,zS=null;
const vbB=h=>{let x0=WB.x0-120,x1=WB.x1+120-vb.w,y0=WB.y0-80,y1=WB.y1+80-h;if(x1<x0)x0=x1=(x0+x1)/2;if(y1<y0)y0=y1=(y0+y1)/2;return{x0,x1,y0,y1}};
function panSoft(){const s=$('#csv');if(!s||!panRaw)return;const r=s.getBoundingClientRect();if(!r.width||!r.height)return;
 const w=vb.w,h=w*r.height/r.width,b=vbB(h);vb.x=rbP(panRaw.x,b.x0,b.x1,w);vb.y=rbP(panRaw.y,b.y0,b.y1,h);s.setAttribute('viewBox',`${vb.x} ${vb.y} ${w} ${h}`)}
function flingStop(){const a=!!flingId;if(flingId){cancelAnimationFrame(flingId);flingId=0}if(zS&&zS.raf)zS.stop();return a}
function panRelease(p,e){const s=$('#csv');if(!s)return;let vx=0,vy=0;
 if(!RM()&&p&&p.h&&p.h.length>1){const a=p.h[0],b=p.h[p.h.length-1],dt=(b[0]-a[0])/1000;if(dt>.005&&e.timeStamp-b[0]<80){const k=vb.w/s.getBoundingClientRect().width;vx=-(b[1]-a[1])/dt*k;vy=-(b[2]-a[2])/dt*k}}
 panRaw=null;if(RM()){setVB();return}flingStart(vx,vy)}
function flingStart(vx,vy){const s=$('#csv');if(!s)return;let t=performance.now();const pos=[vb.x,vb.y],vel=[vx,vy];
 const step=now=>{const dt=Math.min(.05,(now-t)/1000);t=now;const r=s.getBoundingClientRect(),w=vb.w,h=w*r.height/r.width,b=vbB(h),lo=[b.x0,b.y0],hi=[b.x1,b.y1];let rest=1;
  for(let i=0;i<2;i++){let p=pos[i],v=vel[i];const tg=p<lo[i]?lo[i]:p>hi[i]?hi[i]:null;
   if(tg!=null){const w0=6.2832/.4,k=w0*w0,c=2*w0,n=Math.max(1,Math.ceil(dt/.004)),hh=dt/n;for(let j=0;j<n;j++){v+=(-k*(p-tg)-c*v)*hh;p+=v*hh}if(Math.abs(p-tg)<.2&&Math.abs(v)<3){p=tg;v=0}}
   else{v*=Math.pow(.998,dt*1000);p+=v*dt;if(Math.abs(v)<6)v=0}
   pos[i]=p;vel[i]=v;if(v||p<lo[i]||p>hi[i])rest=0}
  vb.x=pos[0];vb.y=pos[1];s.setAttribute('viewBox',`${vb.x} ${vb.y} ${w} ${h}`);
  if(rest){flingId=0;setVB();return}flingId=requestAnimationFrame(step)};
 flingId=requestAnimationFrame(step)}
// Zoom buttons: one persistent spring, so rapid taps re-target without losing velocity
window.zm=f=>{const cx=innerWidth/2,cy=innerHeight/2,lim=w=>Math.max(220,Math.min(WB.x1-WB.x0+240,w));
 if(RM()){zoomAt(f,cx,cy);return}
 if(!zS)zS=mkSpring({resp:.4,damp:1});zS.tick=w=>zoomAt(w/vb.w,cx,cy);
 const base=zS.raf?zS.to:vb.w;if(!zS.raf)zS.x=vb.w;zS.go(lim(base*f))};

render();sweepRand();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
