<script>
const $=s=>document.querySelector(s);
const DK=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const TPL=[
{n:'Water',i:'💧',t:'amount',g:2.5,u:'L',s:0.25,c:'#27c4ff',viz:'glass'},
{n:'Walking',i:'🚶',t:'amount',g:5,u:'km',s:1,c:'#8fd400'},
{n:'Sleep',i:'🌙',t:'amount',g:8,u:'hours',s:1,c:'#8b7bff'},
{n:'Reading',i:'📖',t:'amount',g:30,u:'min',s:15,c:'#ff9f43'},
{n:'Make the bed',i:'🛏️',t:'binary',g:1,u:'',s:1,c:'#00b8b0'},
{n:'Social media',i:'📱',t:'limit',g:2,u:'hours',s:0.5,c:'#ff6b57'}];
const CATS=[['health','Health 🌳'],['learning','Learning 📚'],['fitness','Fitness 🏁'],['rest','Rest & recovery 🌙'],['other','Other 🌼']];
const LV=['Beginner','Building Momentum','Consistent','Thriving','Unstoppable'];
const r3=x=>Math.round(x*1000)/1000;
const fmt=x=>String(r3(x));
const dk=d=>{const z=new Date(d);return z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0')};
const addD=(k,n)=>{const d=new Date(k+'T12:00:00');d.setDate(d.getDate()+n);return dk(d)};
const today=()=>dk(new Date());
let S;try{S=JSON.parse(localStorage.getItem('pulse1'))}catch(e){}
S=S||{habits:[],days:{},awards:{},xp:0,set:{sound:true,reduce:false,theme:'auto'}};
let fp=null,fpPushed=false,tab='home',undo=null,sel=today(),popId=null,enter=true,dir=0,busy=0;const PV={};
function save(){try{localStorage.setItem('pulse1',JSON.stringify(S))}catch(e){}}
const sched=(h,k)=>!h.paused&&!h.archived&&k>=h.start&&(h.once?k===h.once:h.days.includes(new Date(k+'T12:00:00').getDay()));
const val=(h,k)=>(S.days[k]&&S.days[k][h.id])?S.days[k][h.id].v:0;
const tgt=(h,k)=>(S.days[k]&&S.days[k][h.id])?S.days[k][h.id].t:h.g;
function ok(h,k){const v=val(h,k),t=tgt(h,k);
 if(h.t==='limit')return (S.days[k]&&S.days[k][h.id]&&v<=t)||(k<today()&&v<=t);
 return v>=t&&v>0||(h.t==='binary'&&v>=1)}
function frac(h,k){if(h.t==='limit')return ok(h,k)?1:0;return Math.min(1,val(h,k)/tgt(h,k))}
function dayPct(k){const hs=S.habits.filter(h=>sched(h,k));if(!hs.length)return null;return hs.reduce((a,h)=>a+frac(h,k),0)/hs.length}
function streak(h){if(h.once)return 0;let k=today(),n=0,sc=99;
 if(sched(h,k)&&!ok(h,k))k=addD(k,-1);
 for(let i=0;i<400&&k>=h.start;i++,k=addD(k,-1)){if(!sched(h,k))continue;if(ok(h,k)){n++;sc++}else if(sc<7)break;else sc=0}
 return n}
const allStreak=()=>S.habits.reduce((m,h)=>Math.max(m,streak(h)),0);
function lvl(){const l=Math.min(4,Math.floor(Math.sqrt(S.xp/50)));const a=l*l*50,b=(l+1)*(l+1)*50;return{l,p:l>=4?1:(S.xp-a)/(b-a),a,b}}
function log(h,delta,k,c){k=k||sel;S.days[k]=S.days[k]||{};
 const prev=S.days[k][h.id]?{...S.days[k][h.id]}:null,was=ok(h,k);
 const cur=S.days[k][h.id]||{v:0,t:h.g};
 let nv=r3(Math.max(0,cur.v+delta));if(h.t==='binary')nv=Math.min(1,nv);
 if(nv===cur.v&&prev)return;
 S.days[k][h.id]={...cur,v:nv,t:cur.t,...(c?{c}:{})};
 undo={hid:h.id,k,prev};
 if(!was&&ok(h,k)&&h.t!=='limit'){const ak=k+'|'+h.id;if(!S.awards[ak]){S.awards[ak]=1;S.xp+=20;popId=h.id;celebrate(h);toast(h.i+' '+h.n+' complete! +20 XP',true)}else toast('Logged (XP already earned today)',true)}
 else if(h.av||h.t==='check'||h.t==='rating')toast(h.av?(delta>0?'Slip logged. Tomorrow is a fresh start.':delta<0?'Slip removed':'Marked clean today ✓'):'Saved',true);
 else if(delta>0){const ak='p|'+k+'|'+h.id;if(!S.awards[ak]){S.awards[ak]=1;S.xp+=2}toast('Logged '+fmt(delta)+' '+h.u,true)}
 else toast('Removed '+fmt(-delta)+' '+h.u,true);
 const hs=S.habits.filter(x=>sched(x,k));
 if(hs.length&&hs.every(x=>ok(x,k))&&!S.awards['all|'+k]){S.awards['all|'+k]=1;S.xp+=30;setTimeout(()=>toast('🎉 All goals done today! +30 XP',false),900)}
 vib(15);save();render();setTimeout(eraCheck,1200);if(h.rand)setTimeout(()=>sweepRand(true),4600)}
function sweepRand(say){const t=today(),done=h=>h.t==='limit'?(h.start<t&&ok(h,h.start)):Object.keys(S.days).some(k=>k>=h.start&&k<=t&&S.days[k][h.id]&&ok(h,k)),gone=S.habits.filter(h=>h.rand&&done(h));
 if(!gone.length)return;S.habits=S.habits.filter(h=>!gone.includes(h));save();if(!fp)render();if(say)toast('Cleared: '+gone.map(h=>h.i+' '+h.n).join(', '))}
function doUndo(){if(!undo)return;const{hid,k,prev}=undo;if(prev)S.days[k][hid]=prev;else delete S.days[k][hid];undo=null;save();render();$('.toast')&&$('.toast').remove()}

function vib(n){if(!S.set.reduce&&navigator.vibrate)try{navigator.vibrate(n)}catch(e){}}
function snd(){if(!S.set.sound)return;try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=660;o.frequency.linearRampToValueAtTime(990,c.currentTime+.12);g.gain.value=.05;g.gain.linearRampToValueAtTime(0,c.currentTime+.25);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.25)}catch(e){}}
function celebrate(h){snd();vib([30,40,30]);if(S.set.reduce||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const cs=['#b6f23a','#27e0d4','#ff6b57',h.c];for(let i=0;i<22;i++){const p=document.createElement('i');p.className='pt';const a=Math.random()*6.28,d=60+Math.random()*90;p.style.cssText='left:50%;top:40%;background:'+cs[i%4]+';--x:'+Math.cos(a)*d+'px;--y:'+Math.sin(a)*d+'px';document.body.appendChild(p);setTimeout(()=>p.remove(),950)}}
function pv(k,t){const f=PV[k]??0;PV[k]=t;return f}
function ring(p,size,txt,sw,key,n){sw=sw||12;key=key||size;const r=(size-sw)/2,c=2*Math.PI*r,f=pv('r'+key,p),cx=size/2,hn=n!==undefined,fn=hn?pv('n'+key,n):0;

rest:{easy:[['Deep breathing','🌬️','amount',3,'min',1],['Lights out on time','🌙','binary']],medium:[['Wind-down time','🕯️','amount',20,'min',5],['In bed by 10pm','🛌','binary']],hard:[['Phone limit','📵','limit',1,'hours',.5],['Screen-free evening','🌆','amount',2,'hours',.5]]},
other:{easy:[['Tidy your desk','🧹','binary'],['Write one line in a journal','✍️','binary']],medium:[['Journal','📓','amount',10,'min',5],['Learn something new','💡','amount',20,'min',5]],hard:[['Declutter a space','📦','amount',30,'min',10],['Practice a skill','🎯','amount',45,'min',15]]}};
const CCOL={health:'#8fd400',learning:'#ff9f43',fitness:'#ff6b57',rest:'#8b7bff',other:'#00b8b0'};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
window.randHabits=()=>{const have=new Set(S.habits.map(h=>h.n.trim().toLowerCase())),q=shuf(['easy','medium','hard']),ids=[];
 for(const c of shuf(CATS.map(x=>x[0]))){if(!q.length)break;const d=q[0],cand=POOL[c][d].filter(o=>!have.has(o[0].toLowerCase()));if(!cand.length)continue;q.shift();
  const o=cand[Math.floor(Math.random()*cand.length)],bin=o[2]==='binary',id='h'+Date.now()+Math.random().toString(36).slice(2,6);ids.push(id);have.add(o[0].toLowerCase());
  S.habits.push({id,n:o[0],i:o[1],t:o[2],g:bin?1:o[3],u:bin?'':o[4],s:bin?1:o[5],c:CCOL[c],cat:c,days:[0,1,2,3,4,5,6],start:today(),rand:true})}
 if(!ids.length){toast('You already have all of the random ideas!');return}
 save();if(fp)leaveF();else render();
 toast('Added '+ids.length+' random habit'+(ids.length>1?'s':'')+' 🎲',()=>{S.habits=S.habits.filter(h=>!ids.includes(h.id));save();render()})};
window.openNew=(id,once)=>{if(id&&!H(id))return;fp={id:id||'',once:!!once};enter=true;dir=1;try{history.pushState({f:1},'');fpPushed=true}catch(e){}scrollTo(0,0);render()};
window.leaveF=()=>{fp=null;enter=true;dir=-1;render();scrollTo(0,0);if(fpPushed){fpPushed=false;try{history.back()}catch(e){}}};
window.closeF=()=>leaveF();
addEventListener('popstate',()=>{fpPushed=false;if(fp){fp=null;enter=true;dir=-1;render();scrollTo(0,0)}});
function formView(){const id=fp.id,e=id?H(id):null,OO=e?!!e.once:!!fp.once,x=e||{n:'',i:'⭐',t:'amount',g:1,u:'',s:1,c:'#8fd400',days:[0,1,2,3,4,5,6]};
 return `<div class="fpage"><div class="row" style="margin-bottom:var(--s3)"><button class="chip" onclick="closeF()" aria-label="Back">‹ Back</button></div><h1>${e?'Edit':'New'} habit</h1>
 ${e?'':`<h2>Quick start</h2><div class="chips">${TPL.map((t,i)=>`<button class="chip" onclick="fill(${i})">${t.i} ${t.n}</button>`).join('')}</div><div style="margin-top:var(--s3)"><button class="btn ghost sm" onclick="randHabits()">🎲 Surprise me: add 3 random habits</button></div>`}
 <h2>Details</h2><div class="card">
 <label>Name</label><input id="fn" maxlength="40" value="${esc(x.n)}" placeholder="e.g. Drink water">
 <div class="row"><div class="sp"><label>Icon (emoji)</label><input id="fi" maxlength="4" value="${x.i}"></div><div class="sp"><label>Colour</label><input id="fc" type="color" value="${x.c}"></div></div>
 <label>Tracking</label><select id="ft" onchange="tf()"><option value="amount" ${x.t==='amount'?'selected':''}>Reach a target amount</option><option value="binary" ${x.t==='binary'?'selected':''}>Done / not done</option><option value="limit" ${x.t==='limit'?'selected':''}>Stay below a maximum</option><option value="avoid" ${x.av?'selected':''}>Break a habit (stay clean)</option><option value="check" ${x.t==='check'?'selected':''}>Checklist of steps</option><option value="rating" ${x.t==='rating'?'selected':''}>Rate 1–5</option></select>
 <div class="row" id="fgrow"><div class="sp"><label id="fgl">Target</label><input id="fg" type="number" step="any" min="0" value="${x.g}"></div><div class="sp"><label>Unit</label><input id="fu" maxlength="12" value="${esc(x.u)}" placeholder="L, km, min…"></div><div class="sp"><label>Quick step</label><input id="fs" type="number" step="any" min="0" value="${x.s}"></div></div>
 <div id="fitems"><label>Checklist items (one per line, up to 12)</label><textarea id="fit" rows="4" maxlength="400" placeholder="Brush teeth&#10;Floss">${esc((x.items||[]).join('\n'))}</textarea></div><label>Category</label><select id="fcat">${CATS.map(c=>`<option value="${c[0]}" ${(x.cat||'health')===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select><label>Repeat</label><select id="fr" onchange="tf()"><option value="">Repeat on chosen days</option><option value="1" ${OO?'selected':''}>Just one day (one-time goal)</option></select><div id="fdt"><label>Date</label><input id="fd" type="date" value="${e&&e.once?e.once:today()}" ${e?'':'min="'+today()+'"'}></div><div id="fdays"><label>Days</label><div class="chips">${DK.map((d,i)=>`<button class="chip ${x.days.includes(i)?'on':''}" data-d="${i}" onclick="this.classList.toggle('on')">${d}</button>`).join('')}</div></div></div>
 <p id="fe" style="color:var(--coral)"></p><div class="row"><button class="btn ghost sp" onclick="closeF()">Cancel</button><button class="btn sp" onclick="saveH('${id||''}')">Save</button></div></div>`}
window.fill=i=>{const t=TPL[i];fn.value=t.n;fi.value=t.i;fc.value=t.c;ft.value=t.t;fg.value=t.g;fu.value=t.u;fcat.value=t.cat;fs.value=t.s;window._viz=t.viz;tf()};
window.tf=()=>{const t=ft.value,o=fr.value==='1';fgrow.style.display=(t==='check'||t==='avoid')?'none':'';fitems.style.display=t==='check'?'':'none';fgl.textContent=t==='rating'?'Goal (1–5)':t==='limit'?'Maximum':'Target';fdt.style.display=o?'':'none';fdays.style.display=o?'none':''};
window.closeM=()=>$('#ov').innerHTML='';
window.saveH=id=>{const n=fn.value.trim(),ty=ft.value,once=fr.value==='1',dt=fd.value,items=fit.value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,12),t=ty==='avoid'?'limit':ty;
 let g=parseFloat(fg.value),s=parseFloat(fs.value),u=fu.value.trim();
 const d=once?[0,1,2,3,4,5,6]:[...document.querySelectorAll('.fpage [data-d].on')].map(b=>+b.dataset.d);
 if(ty==='avoid'){g=0;s=1;u='slips'}else if(ty==='check'){g=items.length;s=1;u=''}else if(ty==='rating'){g=Math.min(5,g);s=1;u=''}
 const err=!n?'Give your habit a name.':(ty==='check'&&!items.length)?'Add at least one checklist item.':(t!=='binary'&&ty!=='avoid'&&ty!=='check'&&!(g>0))?'Target must be a number above 0.':(t!=='binary'&&!(s>0))?'Quick step must be above 0.':(once&&!dt)?'Pick a date for your one-time goal.':!d.length?'Pick at least one day.':'';
 if(err){fe.textContent=err;return}
 const o={n,i:fi.value||'⭐',c:fc.value,t,g:t==='binary'?1:r3(g),s:t==='binary'?1:r3(s),u,cat:fcat.value,days:d,av:ty==='avoid'?1:0,items:ty==='check'?items:undefined,once:once?dt:undefined};
 if(once)o.start=dt;
 if(id){const h=H(id);if(h.g!==o.g)toast('Target changed — past days keep their old targets.',false);Object.assign(h,o)}
 else S.habits.push({id:'h'+Date.now()+Math.random().toString(36).slice(2,5),start:today(),viz:window._viz&&/water/i.test(n)?window._viz:undefined,...o});
 window._viz=0;save();leaveF();if(once&&dt>today())toast('🎯 Scheduled for '+new Date(dt+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}),false)};
const NAV=[['home','<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>','Today'],['world','<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>','World'],['insights','<svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>','Insights'],['me','<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>','You']];
function post(){requestAnimationFrame(()=>requestAnimationFrame(()=>{
 document.querySelectorAll('[data-w]').forEach(e=>e.style.width=e.dataset.w+'%');
 document.querySelectorAll('[data-o]').forEach(e=>e.style.strokeDashoffset=e.dataset.o);
 document.querySelectorAll('[data-y]').forEach(e=>e.style.transform='translateY('+e.dataset.y+'px)');
 const rm=S.set.reduce||matchMedia('(prefers-reduced-motion:reduce)').matches;
 document.querySelectorAll('[data-n]').forEach(e=>{const f=+e.dataset.f,t=+e.dataset.n,sf=e.dataset.s||'';if(f===t||rm){e.textContent=t+sf;return}const t0=performance.now();(function st(now){const p=Math.min(1,(now-t0)/600),q=1-Math.pow(1-p,3);e.textContent=Math.round(f+(t-f)*q)+sf;if(p<1)requestAnimationFrame(st)})(t0)})}))}
function navUI(t){t=t||tab;const n=$('nav'),i=NAV.findIndex(x=>x[0]===t);n.firstChild.style.setProperty('--i',i);n.firstChild.style.setProperty('--n',NAV.length);[...n.querySelectorAll('button')].forEach((b,j)=>{b.classList.toggle('on',j===i);b.setAttribute('aria-current',j===i?'page':'false')})}
function go(t){if(t===tab||busy)return;const ix=x=>NAV.findIndex(n=>n[0]===x),d=ix(t)>ix(tab)?1:-1,a=$('#app');
 const sw=()=>{tab=t;enter=true;dir=d;scrollTo(0,0);render();busy=0};
 navUI(t);if(S.set.reduce||matchMedia('(prefers-reduced-motion:reduce)').matches){sw();return}
 busy=1;a.className=d>0?'outL':'outR';setTimeout(sw,160)}
function render(){document.documentElement.dataset.theme=S.set.theme==='auto'?'':S.set.theme;document.body.classList.toggle('rm',S.set.reduce);
 document.body.classList.toggle('inform',!!fp);const v=fp?formView():{home,world,insights,me}[tab]();const a=$('#app');a.className=enter?'enter'+(dir>0?' inR':dir<0?' inL':''):'';enter=false;dir=0;a.innerHTML=v;if(fp)tf();
 let n=$('nav');if(!n){n=document.createElement('nav');n.setAttribute('aria-label','Main');n.innerHTML='<div><span class="ind"><i></i></span>'+NAV.map(t=>`<button onclick="go('${t[0]}')"><span class="pi">${t[1]}</span>${t[2]}</button>`).join('')+'</div>';document.body.appendChild(n)}
 navUI();
 post();if(popId)setTimeout(()=>popId=null,900)}

setInterval(()=>{const e=document.querySelector('.tm');if(e&&S.timer){const t=Math.floor((Date.now()-S.timer.start)/1000);e.textContent='⏹ '+Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}},1000);
addEventListener('contextmenu',e=>{if(!/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))e.preventDefault()});
render();sweepRand();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
